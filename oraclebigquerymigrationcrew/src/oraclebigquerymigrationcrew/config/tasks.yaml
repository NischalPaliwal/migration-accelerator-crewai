discover_oracle_schema_task:
  description: >
    Connect to the Oracle database and perform a complete asset inventory.
    Using the oracle tools, execute the following steps in order:

    1. Call list_tables and list_views to retrieve all tables and views in the target schema
       '{oracle_schema}'. Record table/view names and row counts.
       - Classify tables and views that begin with "SRC" or "src" as Bronze (raw) candidates.
       - Classify all other tables and views as potential Silver or Gold candidates depending
         on their transformation logic and dependency depth.
    2. Call list_procedures to retrieve all stored procedures and functions
       in schema '{oracle_schema}'.
    3. For EACH procedure and function found: call get_proc_body to retrieve
       the full PL/SQL source, then call get_dependencies to find every
       object it references. Do not skip any object.
       During retrieval, inspect the PL/SQL body and tag each object with its
       detected proc_pattern using these rules:
         - MERGE_UPSERT    → body contains MERGE INTO or INSERT ... ON CONFLICT patterns
         - SCD_TYPE_2      → body maintains history columns (effective_date, end_date,
                             is_current, valid_from, valid_to or similar SCD2 conventions)
         - HELPER_FUNCTION → object type is FUNCTION and returns a scalar value or
                             expression; body has no DML on target tables
         - TABLE_REFRESH   → body is primarily INSERT OVERWRITE, TRUNCATE+INSERT,
                             DELETE+INSERT, or a simple table population with no
                             MERGE or SCD2 logic
         - UNIQUE_LOGIC    → body contains business transformation logic not captured
                             in any existing table or view definition
       If multiple patterns are detected, tag all that apply and note the primary one.
    4. For EACH table AND view: call get_table_ddl (for tables) or get_view_ddl (for views)
       to retrieve the full CREATE TABLE / CREATE VIEW statement including
       constraints, indexes and comments.
    5. Write the complete inventory to the migration log using
       write_migration_log. The log entry for each object must include:
       object_name, object_type (TABLE / VIEW / PROCEDURE / FUNCTION), schema,
       row_count (tables only), dependency_list, raw_source (proc body, DDL, or
       view definition), proc_pattern (procedures/functions only),
       medallion_layer (BRONZE if name starts with SRC/src, otherwise SILVER_CANDIDATE),
       status=DISCOVERED.
    6. Return a structured summary: total tables found, total views found,
       total procedures found (broken down by proc_pattern), total functions found,
       total unique dependencies identified.
    7. Never generate random answers if a particular object is not present.

    Schema to scan: {oracle_schema}
  expected_output: >
    A structured discovery report containing:
    - Total object counts by type (tables, views, procedures broken down by
      proc_pattern, functions)
    - A complete list of every object discovered with its name, type,
      proc_pattern (where applicable), dependency count, dependency list,
      and assigned medallion_layer
    - Confirmation that every object has been written to the migration log
      with status=DISCOVERED
    - Any objects that could not be read (with the error reason)
    - Any object which is not present must be reported as absent rather than guessed
    - Make sure to write migration logs for each table, view, function, and procedure
      using the write_migration_log tool
    Format: structured text with clear sections, no JSON blobs in the output
  agent: discovery_agent

classify_complexity_task:
  description: >
    Read the complete discovery output from the previous task and apply the
    migration strategy and complexity scoring rubric to every Oracle object.

    ## PART 1 — PROCEDURE & FUNCTION MIGRATION STRATEGY
    For every procedure and function, assign a migration_strategy based on
    the proc_pattern detected during discovery. This is the primary decision
    — apply it before complexity scoring:

      proc_pattern=TABLE_REFRESH  → migration_strategy=DISCARD
        Rationale: In dbt, every `dbt run` automatically refreshes all models.
        Procedures that exist only to populate or refresh a table are fully
        replaced by the dbt run cycle. No artifact is generated — the target
        table will be produced by its corresponding dbt model instead.
        Write status=DISCARDED and discard_reason="Replaced by dbt run cycle"
        to the migration log. Do NOT process these further.

      proc_pattern=MERGE_UPSERT   → migration_strategy=INCREMENTAL_MODEL
        Convert the target table of the MERGE INTO statement to a dbt model
        with materialized='incremental'. The procedure itself is discarded;
        its upsert logic is expressed directly in the incremental model SQL
        using dbt's incremental materialisation pattern.

      proc_pattern=SCD_TYPE_2     → migration_strategy=DBT_SNAPSHOT
        Convert to a dbt snapshot under the snapshots/ directory.
        Use the 'timestamp' strategy if updated_at or equivalent columns exist,
        otherwise use the 'check' strategy with all non-key columns.
        The procedure itself is discarded; dbt snapshot handles history tracking.

      proc_pattern=HELPER_FUNCTION → migration_strategy=DBT_MACRO
        Oracle functions that return scalar values or expressions become
        dbt Jinja macros written to macros/<function_name_lower>.sql.
        Macros are reusable across models via {{ macro_name(...) }}.

      proc_pattern=UNIQUE_LOGIC   → migration_strategy=DBT_MODEL
        Procedures that contain business transformation logic not captured
        elsewhere become dbt models in models/silver/ or models/gold/.
        The medallion layer is determined by what the procedure reads from.

      proc_pattern=multiple / ambiguous → flag for human classification review.
        Write to human_review_queue with the detected patterns listed.

    ## PART 2 — COMPLEXITY SCORING
    Apply complexity scoring ONLY to objects with migration_strategy in
    (INCREMENTAL_MODEL, DBT_SNAPSHOT, DBT_MACRO, DBT_MODEL).
    Objects with migration_strategy=DISCARD are not scored.

    Score each qualifying object as LOW, MEDIUM, or HIGH:

    LOW — qualifies for full automated dbt conversion:
      - Pure SELECT / INSERT / UPDATE with no cursors
      - Simple aggregations, GROUP BY, window functions
      - No calls to other procedures or packages
      - No dynamic SQL (no EXECUTE IMMEDIATE)
      - Dependency count: 0 to 3 objects, all tables

    MEDIUM — qualifies for automated dbt with review:
      - Single CURSOR FOR loop
      - Standard MERGE / UPSERT patterns
      - Calls 1 to 2 other procedures (which are themselves LOW)
      - Basic exception handling (WHEN OTHERS)
      - Dependency count: 3 to 8 objects

    HIGH — must be flagged for human review:
      - Nested cursors (cursor inside a cursor)
      - EXECUTE IMMEDIATE or dynamic SQL of any kind
      - Calls to DBMS_* packages (DBMS_OUTPUT, DBMS_SQL, DBMS_SCHEDULER)
      - Cross-schema dependencies (owner != '{oracle_schema}')
      - References to database links (@REMOTE_DB)
      - Java stored procedure calls
      - Dependency count: more than 8 objects
      - Any object where automated conversion confidence is below 0.75

    ## PART 3 — MEDALLION LAYER ASSIGNMENT
    Assign medallion_layer to tables, views, and DBT_MODEL procedures:
      BRONZE  — tables or views whose Oracle name starts with "SRC" or "src".
                Sourced via dbt source() and placed under models/bronze/.
      SILVER  — tables, views, or UNIQUE_LOGIC procedures that transform or
                enrich Bronze data. Placed under models/silver/.
      GOLD    — tables, views, or UNIQUE_LOGIC procedures that aggregate Silver
                data for reporting or KPIs. Placed under models/gold/.

    ## PART 4 — TOPOLOGICAL SORT
    Produce a dependency-ordered migration sequence:
      - DISCARD objects are removed from the sequence entirely
      - BRONZE objects always precede SILVER, SILVER always precedes GOLD
      - Within the same layer, order by dependency count ascending
      - DBT_SNAPSHOT objects are sequenced after their Bronze source tables
      - Objects that are depended upon by others appear before their dependents

    Write the full classification manifest to the migration log. Each entry
    must include: complexity (where applicable), migration_strategy,
    migration_order_index, medallion_layer, depends_on list, blocked_until list,
    discard_reason (where applicable). Use write_migration_log and
    read_migration_log tools to read and write the migration log.

  expected_output: >
    A migration classification manifest containing:
    - Count of procedures/functions per migration_strategy:
        DISCARD / INCREMENTAL_MODEL / DBT_SNAPSHOT / DBT_MACRO / DBT_MODEL
    - Count of DISCARDED objects with their discard_reason
    - Count of objects per complexity tier (LOW / MEDIUM / HIGH) for
      non-discarded procedural objects
    - Count of objects per medallion layer (BRONZE / SILVER / GOLD)
    - A dependency-ordered list of all non-discarded objects showing
      migration sequence, migration_strategy, and medallion layer
    - A list of HIGH complexity objects flagged for human review with
      specific reasons why each was scored HIGH
    - A list of ambiguous proc_pattern objects added to human_review_queue
    - Estimated automation rate: percentage of objects fully auto-converted
      vs requiring human intervention (excluding DISCARDs from denominator)
  agent: classifier_agent
  context:
    - discover_oracle_schema_task

convert_schemas_task:
  description: >
    Convert every Oracle table and view DDL discovered in the previous tasks into
    BigQuery-compatible schema definitions and dbt project files following the
    medallion architecture (Bronze / Silver / Gold). Follow these steps strictly
    in order.

    ## STEP 1 — Type Mapping
    Read the Oracle DDL from the migration log, then load schema_map.json
    using the read_config tool to get type mapping rules. Apply the
    following Oracle → BigQuery type conversions:
      - NUMBER(p,s)  → NUMERIC(p,s)
      - NUMBER       → FLOAT64  [emit a WARNING in the report]
      - VARCHAR2(n)  → STRING
      - CHAR(n)      → STRING
      - DATE         → DATETIME  (Oracle DATE always includes time component)
      - TIMESTAMP    → TIMESTAMP
      - CLOB         → STRING
      - BLOB         → BYTES
      - INTEGER      → INT64
      - BOOLEAN      → BOOL

    ## STEP 2 — Partitioning & Clustering
    Apply BigQuery partitioning rules:
      - Tables with > 1M rows: partition by the first DATE or TIMESTAMP
        column found; if none exists, use _PARTITIONTIME pseudo-column
      - Tables with <= 1M rows: no partitioning needed

    Apply BigQuery clustering rules:
      - Cluster on columns that appear in WHERE clauses of stored procedures
        that reference this table, derived from the dependency analysis
        produced in prior tasks (max 4 clustering columns, BigQuery limit)

    ## STEP 3 — Create BigQuery Tables (Bronze SRC/src objects FIRST)
    Execute BigQuery DDL using the create_table tool with this strict order:
      Process ONLY tables and views whose Oracle name starts with "SRC" or "src" first.
      Do NOT create BigQuery tables for non-SRC tables or views in this step;
      those are handled by dbt models in later steps.

    For every Bronze (SRC/src) object, generate and execute a BigQuery CREATE TABLE:
      CREATE TABLE IF NOT EXISTS `{gcp_project}.{bq_dataset}.<table_name_lower>`
      (
        <column_name> <bq_type> [OPTIONS(description="<oracle_col_comment>")],
        ...
      )
      [PARTITION BY <partition_col> | _PARTITIONTIME]
      [CLUSTER BY <col1>, <col2>, ...]
      OPTIONS (description = "<oracle_table_comment_if_any>");

    BigQuery table names must be lowercase snake_case of the Oracle name.

    ## STEP 4 — Generate sources.yml (Bronze layer ONLY)
    Generate models/bronze/sources.yml. Include ONLY SRC/src-prefixed objects.

      version: 2
      sources:
        - name: <bq_dataset>
          database: {gcp_project}
          schema: {bq_dataset}
          description: "Raw Bronze layer — Oracle migration landing tables"
          tags: ["bronze", "raw", "oracle_migration"]
          tables:
            - name: <src_table_name_lower>
              description: "<oracle_table_comment_or_generated_description>"
              columns:
                - name: <column_name>
                  description: "<oracle_col_comment_or_type_mapping_note>"
                  tests:
                    - not_null   # PK columns only
                    - unique     # PK columns only
              meta:
                partition_column: "<partition_col>"       # partitioned tables only
                clustering_columns: ["<col1>", "<col2>"]  # clustered tables only

    ## STEP 5 — Generate dbt Model SQL Files (Medallion Folder Structure)

      models/
        bronze/
          sources.yml
          <src_table>.sql    ← thin source() wrapper
        silver/
          schema.yml
          <silver_model>.sql ← ref() only
        gold/
          schema.yml
          <gold_model>.sql   ← ref() only

    Bronze model template (models/bronze/<table_name_lower>.sql):
      {{
          config(materialized='table', tags=['bronze','raw'])
      }}
      select <explicit column list>
      from {{ source('<bq_dataset>', '<table_name_lower>') }}

    Silver model template (models/silver/<model_name_lower>.sql):
      {{
          config(materialized='view', tags=['silver'])
      }}
      with base as (
          select ...
          from {{ ref('<bronze_model_name>') }}
      )
      select ... from base

    Gold model template (models/gold/<model_name_lower>.sql):
      {{
          config(materialized='table', tags=['gold'])
      }}
      select ...
      from {{ ref('<silver_model_name>') }}

    Rules (ALL layers):
      - NEVER write DDL inside .sql model files
      - ONLY Bronze models may use source()
      - Silver and Gold models use ref() exclusively
      - No SELECT * — column list must always be explicit
      - File name must match BigQuery table name (snake_case, lowercase)

    ## STEP 6 — Update Migration Log
    Update status=SCHEMA_CONVERTED on success or status=SCHEMA_FAILED with
    full error detail on failure.

    Target dataset: {bq_dataset} | Project: {gcp_project}

  expected_output: >
    A schema conversion report containing:

    1. TABLE CREATION SUMMARY
       - Count of SRC/src Bronze tables created in BigQuery
       - Count of Silver and Gold models generated as dbt SQL files
       - Count of objects that failed with full error details

    2. TYPE MAPPING DECISIONS
       - Every NUMBER without precision mapped to FLOAT64 (with warning)
       - Any CLOB/BLOB conversions flagged for downstream review

    3. PARTITIONING & CLUSTERING SUMMARY
       - Tables partitioned with chosen column
       - Tables clustered with chosen columns

    4. DBT SOURCES CONFIRMATION
       - Confirmation models/bronze/sources.yml written with SRC/src entries only
       - PK columns have not_null + unique tests
       - No non-SRC objects in sources.yml

    5. DBT MODEL FILES CONFIRMATION
       - .sql file counts per layer (bronze / silver / gold)
       - Bronze uses source(); Silver/Gold use ref()
       - Cross-layer ref() relationships listed

    6. MIGRATION LOG STATUS
       - Count of SCHEMA_CONVERTED and SCHEMA_FAILED objects

  agent: schema_conversion_agent
  context:
    - discover_oracle_schema_task
    - classify_complexity_task

convert_procs_task:
  description: >
    Convert all Oracle procedures and functions with a non-DISCARD, non-HIGH
    migration_strategy into their correct dbt artifact. Process objects in
    the dependency-sorted order from the classification manifest. Skip any
    object until all items in its depends_on list have status=GENERATED or
    status=DISCARDED.

    Objects with migration_strategy=DISCARD are already marked — skip them.
    No artifact is generated for discarded objects.

    ── PATH 1: INCREMENTAL_MODEL (proc_pattern=MERGE_UPSERT) ────────────────
    The MERGE INTO logic becomes a dbt incremental model on the target table.

    1. Identify the MERGE target table and unique_key from the ON clause.
    2. Determine the target table's medallion layer (SILVER or GOLD).
    3. Write models/<layer>/<target_table_lower>.sql:

       {{
           config(
               materialized='incremental',
               unique_key='<key_column>',
               incremental_strategy='merge',
               tags=['<layer>']
           )
       }}
       -- Converted from Oracle procedure: <PROC_NAME>
       -- Pattern: MERGE INTO replaced by dbt incremental materialisation
       with source as (
           select ...
           from {{ ref('<upstream_model>') }}
           {% if is_incremental() %}
           where updated_at > (select max(updated_at) from {{ this }})
           {% endif %}
       )
       select <explicit column list> from source

    4. The procedure itself generates no separate artifact.
    5. Append entry to models/<layer>/schema.yml.

    ── PATH 2: DBT_SNAPSHOT (proc_pattern=SCD_TYPE_2) ───────────────────────
    The SCD Type 2 history logic becomes a dbt snapshot.

    1. Identify source table, unique_key, and updated_at column.
    2. Write snapshots/<source_table_lower>_snapshot.sql:

       {% snapshot <source_table_lower>_snapshot %}
       {{
           config(
               target_schema='{bq_dataset}',
               unique_key='<key_column>',
               strategy='timestamp',
               updated_at='<updated_at_column>',
               -- OR: strategy='check', check_cols=['col1','col2'],
               tags=['snapshot','scd2']
           )
       }}
       select <explicit column list>
       from {{ ref('<source_bronze_or_silver_model>') }}
       {% endsnapshot %}

    3. Append entry to snapshots/schema.yml documenting dbt_scd_id,
       dbt_valid_from, dbt_valid_to, dbt_updated_at columns.
    4. The procedure itself generates no separate artifact.

    ── PATH 3: DBT_MACRO (proc_pattern=HELPER_FUNCTION) ─────────────────────
    Oracle scalar functions become Jinja macros.

    1. Read function body and translate to BigQuery SQL.
    2. Write macros/<function_name_lower>.sql:

       {#
         Converted from Oracle function: <FUNCTION_NAME>
         Parameters: <param1> (<type>), ...
         Returns: <description>
       #}
       {% macro <function_name_lower>(<param1>, ...) %}
           <BigQuery SQL expression>
       {% endmacro %}

    3. No config() block — macros are not materialised.
    4. Call from models as {{ function_name_lower(...) }}.

    ── PATH 4: DBT_MODEL (proc_pattern=UNIQUE_LOGIC) ─────────────────────────
    Procedures with business logic not captured elsewhere become dbt models.

    1. Determine medallion layer from dependency chain.
    2. Write models/<layer>/<proc_name_lower>.sql:

       {{
           config(
               materialized='table',        -- LOW complexity
               -- OR materialized='incremental', unique_key='<pk>', -- MEDIUM
               tags=['<layer>']
           )
       }}
       -- Converted from Oracle procedure: <PROC_NAME>
       with <cte> as (
           select ... from {{ ref('<upstream_model>') }}
       )
       select <explicit column list> from <cte>

    3. Append entry to models/<layer>/schema.yml.

    ── SQL CONVERSION RULES (apply to ALL paths) ────────────────────────────
      CURSOR FOR loop        → CTE or subquery
      NVL(a, b)              → IFNULL(a, b)
      NVL2(a, b, c)          → IF(a IS NOT NULL, b, c)
      DECODE(x, v1,r1, ...)  → CASE WHEN x=v1 THEN r1 ... END
      SYSDATE                → CURRENT_DATETIME()
      SEQUENCE.NEXTVAL       → GENERATE_UUID() or FARM_FINGERPRINT(...)
      ROWNUM                 → ROW_NUMBER() OVER (ORDER BY ...)
      || string concat       → CONCAT(a, b)
      TO_DATE(str, fmt)      → PARSE_DATETIME(fmt, str)
      TO_CHAR(date, fmt)     → FORMAT_DATETIME(fmt, datetime_col)
      TRUNC(date)            → DATE(datetime_col)
      ADD_MONTHS(d, n)       → DATE_ADD(d, INTERVAL n MONTH)
      MONTHS_BETWEEN(d1,d2)  → DATE_DIFF(d1, d2, MONTH)
      INSTR(s, sub)          → STRPOS(s, sub)
      RAISE_APPLICATION_ERROR → Remove; replace with dbt test or comment
      DBMS_OUTPUT.PUT_LINE   → Remove entirely

    Rules for ALL artifacts:
      - NEVER use source() in Silver/Gold models, snapshots, or macros
      - NEVER write raw dataset.table strings — always use ref()
      - NEVER include DDL in model, snapshot, or macro files
      - Explicit column lists only — no SELECT *
      - Macro calls from models use {{ macro_name(...) }}
      - Every key conversion decision documented in an inline SQL comment

    ── MIGRATION LOG UPDATE ─────────────────────────────────────────────────
    After each artifact: status=GENERATED, artifact_type=(INCREMENTAL_MODEL |
    DBT_SNAPSHOT | DBT_MACRO | DBT_MODEL), artifact_path=<relative path>,
    medallion_layer=<SILVER | GOLD | SNAPSHOT | MACRO>.
    Process in batches of 10; write progress to migration log after each batch.

  expected_output: >
    A procedure conversion report containing:
    - Count of DISCARDED objects (replaced by dbt run) — listed by name
    - Count of INCREMENTAL_MODEL artifacts written (with paths)
    - Count of DBT_SNAPSHOT artifacts written (with paths)
    - Count of DBT_MACRO artifacts written (with paths)
    - Count of DBT_MODEL artifacts written (with paths)
    - Count of objects that failed conversion with error details
    - Full list of every artifact written with relative path and artifact_type
    - Key conversion decisions (e.g. "MERGE ON clause → unique_key='order_id'",
      "SCD2 timestamp strategy on updated_at", "NVL → IFNULL at line 22")
    - Objects skipped due to unresolved dependencies, with blocking name
  agent: codegen_agent
  context:
    - classify_complexity_task
    - convert_schemas_task

validate_migrations_task:
  description: >
    Validate every object with status=GENERATED in the migration log.
    Skip all objects with status=DISCARDED — no validation needed.
    Process in the same dependency-sorted order used during conversion.
    Do not validate an object until all depends_on items have
    status=VALIDATED or status=DISCARDED.

    ── FOR INCREMENTAL_MODEL and DBT_MODEL ──────────────────────────────────

    CHECK 1 — SQL syntax dry-run:
      - dry_run_bq on full model SQL
      - FAIL: reason="SYNTAX_ERROR" with exact BigQuery error

    CHECK 2 — Row count reconciliation:
      - count_rows_oracle vs count_rows_bq
      - diff_pct = abs(oracle - bq) / oracle * 100
      - FAIL: reason="COUNT_MISMATCH" if diff_pct > 0.01

    CHECK 3 — Column-level sample:
      - sample_rows_oracle(n=50) vs execute_bq on same 50 PKs
      - FAIL: reason="DATA_MISMATCH" if > 2% of rows differ on any
        non-nullable column; record column_name, oracle_value, bq_value

    ── FOR DBT_SNAPSHOT ─────────────────────────────────────────────────────

    CHECK 1 — Snapshot SQL dry-run:
      - Render snapshot SELECT body and dry_run_bq
      - FAIL: reason="SYNTAX_ERROR"

    CHECK 2 — Snapshot history validation:
      - Verify dbt_scd_id, dbt_valid_from, dbt_valid_to, dbt_updated_at
        columns exist in snapshot target table
      - Verify at least one history record (dbt_valid_to IS NOT NULL) exists
        for any updated Oracle source row
      - FAIL: reason="SNAPSHOT_HISTORY_INVALID"

    ── FOR DBT_MACRO ────────────────────────────────────────────────────────

    CHECK 1 — Macro render and dry-run:
      - Render macro with representative sample argument values
      - dry_run_bq on rendered SQL expression
      - FAIL: reason="SYNTAX_ERROR"

    CHECK 2 — Output equivalence:
      - execute_oracle_function with same sample arguments
      - Compare Oracle output to BigQuery macro output
      - FAIL: reason="MACRO_OUTPUT_MISMATCH"

    ── LINEAGE INTEGRITY (ALL artifact types) ───────────────────────────────
    Before recording any PASS:
      - No raw dataset.table strings in any artifact SQL
        → FAIL: reason="INVALID_REF"
      - source() only in Bronze model files; never in Silver/Gold/snapshots
        → FAIL: reason="INVALID_REF"
      - Every ref('<name>') resolves to an existing file under models/
        → FAIL: reason="INVALID_REF"
      - No DDL statements in any model, snapshot, or macro file
        → FAIL: reason="DDL_IN_ARTIFACT"
      - Every {{ macro_name(...) }} in a model resolves to a file in macros/
        → FAIL: reason="UNRESOLVED_MACRO"

    On PASS:
      - confidence=1.0, status=VALIDATED, validation_result=PASS
      - Append to validation_report.json

    On FAIL:
      - Increment retry_count
      - retry_count < 3  → status=FAILED_VALIDATION (codegen_agent retries)
      - retry_count >= 3 → status=HUMAN_REVIEW
      - Append to validation_report.json with full failure details

  expected_output: >
    A validation report containing:
    - Count of DISCARDED objects skipped (no validation needed)
    - Total objects validated by artifact_type:
        INCREMENTAL_MODEL / DBT_SNAPSHOT / DBT_MACRO / DBT_MODEL
    - PASS count per artifact_type with average confidence score
    - FAIL count by failure type:
        SYNTAX_ERROR / COUNT_MISMATCH / DATA_MISMATCH /
        SNAPSHOT_HISTORY_INVALID / MACRO_OUTPUT_MISMATCH /
        INVALID_REF / DDL_IN_ARTIFACT / UNRESOLVED_MACRO
    - Objects escalated to HUMAN_REVIEW after 3 retries
    - Per FAIL: object name, artifact_type, layer, check failed,
      exact reason, retry count
    - Confirmation Silver/Gold/snapshots use ref() exclusively
    - Confirmation no artifact contains DDL statements
    - Confirmation all macro calls resolve to existing macro files
    - Overall migration health score: % of generated objects validated
  agent: validator_agent
  context:
    - convert_procs_task
    - convert_schemas_task

supervise_migration_task:
  description: >
    Orchestrate and supervise the complete Oracle-to-BigQuery / dbt migration
    for schema '{oracle_schema}'. Execute the following phases in strict order,
    enforcing all quality gates before advancing.
 
    ── PHASE 0: PRE-FLIGHT ──────────────────────────────────────────────────
    1. read_config to confirm oracle_schema, gcp_project, bq_dataset,
       schema_map.json path, and few_shots directory are present and non-empty.
    2. list_tables (limit 1) to verify Oracle connectivity.
       Halt with reason="ORACLE_UNREACHABLE" on failure.
    3. count_rows_bq on information schema to verify BigQuery connectivity.
       Halt with reason="BIGQUERY_UNREACHABLE" on failure.
    4. Write pre_flight_check to migration log:
       status=PRE_FLIGHT_PASSED or PRE_FLIGHT_FAILED with detail.
    5. Proceed only on PRE_FLIGHT_PASSED.
 
    ── PHASE 1: DISCOVERY ───────────────────────────────────────────────────
    Delegate discover_oracle_schema_task to discovery_agent.
    Quality Gate 1:
      - Every object has status=DISCOVERED with non-null medallion_layer.
      - Every procedure/function has a non-null proc_pattern tag.
      - All SRC/src objects tagged BRONZE.
      FAIL → blocking_issue, halt, escalate.
      PASS → phase_summary Phase 1, proceed.
 
    ── PHASE 2: CLASSIFICATION ──────────────────────────────────────────────
    Delegate classify_complexity_task to classifier_agent.
    Quality Gate 2:
      - Every procedure/function has a migration_strategy.
      - Every DISCARD has status=DISCARDED and discard_reason set.
      - Topological sort valid; HIGH objects in human_review_queue.
      FAIL → blocking_issue, halt, escalate.
      PASS → emit human_review_queue report, phase_summary Phase 2, proceed.
 
    ── PHASE 3: SCHEMA CONVERSION ───────────────────────────────────────────
    Delegate convert_schemas_task to schema_conversion_agent.
    Quality Gate 3:
      - sources.yml exists with SRC/src entries only — scan for non-SRC entries.
      - bronze/, silver/, gold/ model directories exist with .sql files.
      - Zero source() calls in Silver/Gold model files.
      - Zero unaddressed SCHEMA_FAILED objects.
      FAIL → blocking_issue, halt, escalate.
      PASS → phase_summary Phase 3, proceed.
 

    Delegate convert_procs_task to codegen_agent.
    Quality Gate 4:
      - Every non-DISCARD, non-HIGH object has status=GENERATED.
      - Correct artifact file exists for each artifact_type and layer.
      - Zero generated files contain raw dataset.table strings.
      - schema.yml / snapshots/schema.yml entries exist for every artifact.
      - Emit updated human_review_queue report.
      FAIL → blocking_issue, halt, escalate.
      PASS → phase_summary Phase 4, proceed.
 
    ── PHASE 5: VALIDATION ──────────────────────────────────────────────────
    Delegate validate_migrations_task to validator_agent.
    Quality Gate 5:
      - Every generated object has status=VALIDATED or HUMAN_REVIEW.
      - pass_rate = VALIDATED / (VALIDATED + HUMAN_REVIEW) >= 0.95.
        Below 0.95 → blocking_issue, halt, escalate.
      - All Silver/Gold/snapshots confirmed ref()-only.
      - No artifacts contain DDL or unresolved macro calls.
      PASS → phase_summary Phase 5, proceed to Phase 6.
 
    ── PHASE 6: FINAL SIGN-OFF ──────────────────────────────────────────────
    Read the full migration log. Confirm every discovered object has a
    terminal status: VALIDATED, DISCARDED, HUMAN_REVIEW, or SCHEMA_FAILED
    with a recorded reason. No object may be in an intermediate status.
    If confirmed → produce Final Migration Completion Report and write
    status=MIGRATION_COMPLETE to the migration log.
    If not confirmed → write blocking_issue for every unresolved object
    and escalate before emitting any completion report.
 
